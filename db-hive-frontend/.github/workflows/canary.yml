name: Canary CI (frontend)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - canary

env:
  CI: true

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Emit start telemetry
        env:
          LOGGING_DSN: ${{ secrets.LOGGING_DSN }}
          CI_STATUS: running
        run: |
          node scripts/emit-build-telemetry.js || true
      - name: Install & Test
        run: |
          if [ -f package.json ]; then
            npm install
            npm test
          else
            echo "No package.json found — skipping tests"
          fi

  build:
    runs-on: ubuntu-latest
    needs: install-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build
        run: |
          if [ -f package.json ]; then
            npm run build || echo "No build script defined or build failed"
          else
            echo "No package.json — skipping build"
          fi

  deploy-frontend-canary:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/canary'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Vercel (placeholder)
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN not configured — skipping deploy"
          else
            echo "Placeholder: deploy to Vercel using VERCEL_TOKEN and project secrets"
            # Example: npx vercel --token "${{ secrets.VERCEL_TOKEN }}" --prod
          fi

  canary-health-check:
    name: canary-health-check
    runs-on: ubuntu-latest
    needs: deploy-frontend-canary
    steps:
      - name: Wait for canary to be ready
        run: sleep 5
      - name: Run health-check assertion
        run: |
          if [ -z "${{ secrets.CI_HEALTH_CHECK_URL }}" ]; then
            echo "CI_HEALTH_CHECK_URL secret not set"
            exit 1
          fi
          echo "Checking ${{ secrets.CI_HEALTH_CHECK_URL }}"
          curl -sSf "${{ secrets.CI_HEALTH_CHECK_URL }}" | jq -e '.status == "ok" and .services.db == "ok"'

  promote-or-halt:
    runs-on: ubuntu-latest
    needs: canary-health-check
    if: success()
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Annotate CI with telemetry
        run: LOGGING_DSN="${{ secrets.LOGGING_DSN }}" CI_STATUS=success node scripts/emit-build-telemetry.js
      - name: Create promotion PR
        uses: actions/github-script@v6
        with:
          script: |
            const base = process.env.PROMOTE_BRANCH || 'release/prd-v0.2';
            const head = context.ref.replace('refs/heads/', '');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title: `Promote canary (${head}) → ${base}`,
              body: `Canary build passed health checks. CI run: ${context.runId}\nCommit: ${context.sha}`,
            });
            core.setOutput('pr-number', pr.number);
      - name: Promotion placeholder
        run: echo "Canary passed — promotion actions (create PR or automated promotion) go here"
