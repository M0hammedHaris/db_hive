name: Canary CI (infra)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - canary

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Emit start telemetry
        env:
          LOGGING_DSN: ${{ secrets.LOGGING_DSN }}
          CI_STATUS: running
        run: |
          node scripts/emit-build-telemetry.js || true
      - name: Validate IaC (placeholder)
        run: |
          echo "Placeholder: run terraform fmt/validate/plan for canary infra changes"

  deploy-infra-canary:
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/canary'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy infra (placeholder)
        run: |
          echo "Placeholder: deploy infra changes to staging/canary (requires provider creds)"

  canary-health-check:
    name: canary-health-check
    runs-on: ubuntu-latest
    needs: deploy-infra-canary
    steps:
      - name: Wait for canary to be ready
        run: sleep 5
      - name: Run health-check assertion
        env:
          CI_HEALTH_CHECK_URL: ${{ secrets.CI_HEALTH_CHECK_URL }}
        run: |
          if [ -z "${CI_HEALTH_CHECK_URL}" ]; then
            echo "CI_HEALTH_CHECK_URL secret not set"
            exit 1
          fi
          echo "Checking ${CI_HEALTH_CHECK_URL}"
          curl -sSf "${CI_HEALTH_CHECK_URL}" | jq -e '.status == "ok" and .services.db == "ok"'

  promote-or-halt:
    runs-on: ubuntu-latest
    needs: canary-health-check
    steps:
      - name: Annotate CI with telemetry
        env:
          LOGGING_DSN: ${{ secrets.LOGGING_DSN }}
          CI_STATUS: success
        run: node scripts/emit-build-telemetry.js
      - name: Create promotion PR
        uses: actions/github-script@v6
        with:
          script: |
            const base = process.env.PROMOTE_BRANCH || 'release/prd-v0.2';
            const head = context.ref.replace('refs/heads/', '');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head,
              base,
              title: `Promote canary (${head}) → ${base}`,
              body: `Canary infra changes passed health checks. CI run: ${context.runId}\nCommit: ${context.sha}`,
            });
            core.setOutput('pr-number', pr.number);
      - name: Promotion placeholder
        run: |
          echo "Placeholder: deploy infra changes to staging/canary (requires provider creds)"
